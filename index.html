<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Private Profile UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="profile-card">
    <div class="lock-icon">🔒</div>
    <h2>Private Profile</h2>
    <p>Follow me to unlock your private notes.</p>
    <button id="follow-btn" class="follow-btn">Follow</button>
    <div id="private-notes" class="private-notes">
      <p>🔒 Private Notes: <span id="private-content">Swipe to unlock</span></p>
    </div>
    <div class="swipe-area" id="swipe-area">
      Swipe to unlock...
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
